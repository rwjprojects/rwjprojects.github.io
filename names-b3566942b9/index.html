    --accent:#83B3EB; --accent-ink:#0E1A28;

  }
}
:root[data-theme="dark"]{
  --ground:#111519; --panel:#181E24; --ink:#E5E9ED; --muted:#98A3AE; --line:#2B333B; --soft:#1F262D;
  --accent:#83B3EB; --accent-ink:#0E1A28;
  --ok:#74C792; --ok-bg:#16301F; --bad:#EE8B85; --bad-bg:#3A1C1B; --warn:#E3B54E; --warn-bg:#352A10; --na:#8E98A2; --na-bg:#242B31;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
header.top{padding-block:28px 12px}
h1{font:700 clamp(28px,5vw,40px)/1.05 var(--display);letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0}
.lede b{color:var(--ink);font-weight:600}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;gap:6px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:20px}
nav.tabs button{font:600 14px var(--body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
nav.tabs button:focus-visible,.chip:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brief{margin:0 0 6px;max-width:72ch}
.funnel{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 13px var(--mono);color:var(--muted);margin:0 0 20px}
.funnel b{color:var(--ink)}
h2{font:600 20px/1.2 var(--display);margin:26px 0 10px}
h2 small{font:400 13px var(--body);color:var(--muted);margin-left:6px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pick .dom{font:600 19px var(--mono);letter-spacing:-.01em;word-break:break-all}
.pick .dom .tld{color:var(--muted);font-weight:400}
.rank{font:600 12px var(--mono);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kv{font-size:13.5px;margin:0}
.kv span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.st{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--mono);border-radius:5px;padding:2px 7px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.bad{background:var(--bad-bg);color:var(--bad)}
.st.warn{background:var(--warn-bg);color:var(--warn)} .st.na{background:var(--na-bg);color:var(--na)}
.score{font:700 15px var(--mono)}
.src{font:500 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.src.rob{color:var(--accent);border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{font:500 13px var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);position:sticky;top:0}
td.nm{font:500 14px var(--mono);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
td.why{color:var(--muted);min-width:260px}
tr:last-child td{border-bottom:0}
.ba{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ba .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ba .col.after{border-color:var(--accent)}
.ba h3{font:600 14px var(--display);margin:0 0 4px}
.ba ol{margin:6px 0 0;padding-left:20px;font:14px/1.7 var(--mono)}
.ba .stat{font-size:12.5px;color:var(--muted);margin:0}
.like{font:600 12.5px var(--body);border:1px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:999px;padding:3px 10px;cursor:pointer;margin-left:8px;white-space:nowrap}
.votebar{background:var(--ok-bg);color:var(--ink);border:1px solid var(--ok);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.votebar b{color:var(--ok)}
.like[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.liked{font:600 11px var(--body);color:var(--ok);margin-left:6px}
.reqs{margin:6px 0 0;padding-left:18px;font-size:13px}
.reqs .flash{color:var(--ok)}
.btn:disabled{opacity:.6}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:space-between;
  background:var(--ink);color:var(--ground);padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.tray .btn{background:var(--ok);border-color:var(--ok);color:#fff}
.tray b{font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
.mylikes{font:13px/1.8 var(--mono);color:var(--ink);margin:-6px 0 12px}
.mylikes .lab{font:600 12px var(--body);color:var(--muted);margin-right:6px}
details.more{margin-top:14px}
details.more > summary{font:600 16px var(--display);padding:4px 0}
.pick .whyline{font-size:13.5px;margin:0}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.kind{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}

.kind .best{font:600 16px var(--mono);word-break:break-all}
.kind .meta{font-size:12.5px;color:var(--muted)}
.spread{display:flex;flex-wrap:wrap;gap:4px 12px;font:12.5px var(--mono);color:var(--muted);margin:0 0 10px}
.spread b{color:var(--ink)}

.dots{display:flex;gap:4px}
.dot{font:600 11px var(--mono);width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center}

summary{cursor:pointer;font-weight:600}

.prose{max-width:74ch}
a{color:var(--accent);text-underline-offset:2px}

.btn{font:600 13.5px var(--body);border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}

.reply{white-space:pre-wrap;font-size:14px;margin:0}

.queue td .st{margin-right:4px}
.fine{font-size:12.5px;color:var(--muted);margin:0}

.tray .btn{min-height:44px;font-size:15px}
.tray .status{flex-basis:100%;margin:0;font-size:13px;color:var(--ground);opacity:.85}
.tray .status:empty{display:none}

.hint{font-size:14px;margin:0 0 10px;color:var(--muted)}
.hint b{color:var(--ink)}
.nlist{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ghead{font:600 14px var(--display);padding:12px 14px 6px;background:var(--soft);border-top:1px solid var(--line)}
.ghead:first-child{border-top:0}
.ghead small{font:400 12px var(--body);color:var(--muted)}

.nrow .nm{font:600 16px var(--mono);word-break:break-all;align-self:center}

.nrow .like{grid-column:2;grid-row:1 / span 2;align-self:start}

.like{min-height:44px;min-width:44px;margin:0;font-size:14px;padding:6px 12px}
details.more h3{font:600 15px var(--display);margin:16px 0 6px}
nav.tabs button{min-height:40px}
@media (prefers-reduced-motion:no-preference){.pick{transition:border-color .15s}.pick:hover{border-color:var(--accent)}}

const META = {"ledeHtml": "Checked name ideas, each scored out of 10.<span class=\"live-only\"></span>", "methodHtml": "<p>This set: <b>1572 names</b> looked up on 16 Sep 2026 — 658 free and kept, 914 already registered and removed. 35 of the 138 names Rob proposed are among the free ones; the rest came from three rounds of generated ideas, one written by a separate agent.</p>\n<h3>1 · Is the .com registered?</h3>\n<p>Every name was looked up in the .com registry itself (Verisign’s public lookup). “Not found” means nobody owns it.\nA second, separate check (public DNS) ran beside it; the two never disagreed. Each run first looked up\n<code>google.com</code> (must come back taken) and a random string (must come back free).</p>\n<h3>2 · Is it about to come free?</h3>\n<p>Only the registry’s own “redemption” or “pending delete” status counts as lapsing. 3 registered names are in that state: <b>holeheartedly.com</b> (GoDaddy.com, LLC), <b>shineandmend.com</b> (HOSTINGER operations, UAB), <b>tendedwell.com</b> (GoDaddy.com, LLC). They are not buyable yet; they may go to the registrar’s auction first, so a backorder is the way to try for one. Names that simply renew soon are listed under each tab as watch-only.</p>\n<h3>3 · What does it cost?</h3>\n<p>Every free name was priced at Porkbun, our registrar: every free name came back at the standard $11.08 a year, and none is priced as premium.</p>\n<h3>4 · Is the handle free?</h3>\n<ul>\n<li><b>TikTok</b>: the profile page carries its own “account not found” code (TikTok answers every address, so the page code is the signal).</li>\n<li><b>YouTube</b>: the @handle page exists or it doesn’t.</li>\n<li><b>X</b>: X’s own sign-up check, which also knows about suspended and reserved handles. X handles must be 5–15 letters, so longer names show “can’t use”.</li>\n<li><b>Instagram</b>: needs a real browser; each name’s page was opened and read.</li>\n</ul>\n<p>Every platform was tested first with an account that exists and one that doesn’t; all passed. The Instagram and X checks first ran in three batches side by side; X refused about a third of those lookups for going too fast, so they were re-run one at a time. Four X handles and two Instagram handles still got no clear answer — they show grey (“not checked”), never as free.</p>\n<h3>5 · Is the name already in use?</h3>\n<p>The top five in each project (20 names, plus the 5 new plant-shop picks from round three — 25 in all) were searched for an existing business, product, app, channel or US trademark in the same field: about 75 web searches and 91 lookups on the USPTO’s own trademark search. Result for the first 20: 14 clear, 5 caution, 1 collision (rcairboss — AirBoss RC is an established RC jet and radio retailer). The 5 new plant picks: 1 clear, 3 caution, 1 collision (aroidalley — “AroidAlli” is a rare-aroid seller). Each top pick shows its own result. Earlier, the reviewer’s searches found Hangar 9 (Horizon Hobby’s RC brand — every “hangar” name echoes it), Tower Hobbies, Knife Edge Software (RealFlight), “buddy box” (a generic RC trainer product), HobbyKing’s Foam Fury planes and “prop nut” (an RC part). The other 210 free names had no collision search of their own.</p>\n<h3>6 · Can the business use it, and who owns the typos?</h3>\n<p>For the top picks only:</p>\n<ul>\n<li><b>Business name.</b> The plant business registers in Alabama, so the Alabama Secretary of State’s business\nsearch is checked automatically (with the name written as separate words, because that search treats spaces\nliterally). The other projects register in Illinois, whose search blocks automated lookups, so each card links to it to\ncheck by hand. Either way the state decides at filing; Alabama also asks for a paid name reservation first.</li>\n<li><b>Shop names (plant shop).</b> Palmstreet shop pages are looked up directly (a shop page means the name is taken).\nWhatnot sits behind a bot check; when it challenges the lookup the result shows “not checked”, never “free”.</li>\n<li><b>Misspellings.</b> About 30–50 likely misspellings of each name — the ones people make after hearing it\n(hanger for hangar, junky for junkie) and after typing fast (a dropped, doubled or swapped letter) — are looked up\nin the .com registry. A few owned misspellings is normal; many means buyers who mistype will land somewhere else.</li>\n</ul>\n<h3>7 · Is it a good name?</h3>\n<p>A separate reviewer rated every free name without being told who wrote which, told to assume they were\nmediocre and to justify any high score against these published rules:</p>\n<ul><li><a href=\"https://eatmywords.com/smile-scratch-test/\">https://eatmywords.com/smile-scratch-test/</a></li><li><a href=\"https://www.martyneumeier.com/strong-vs-weak-names\">https://www.martyneumeier.com/strong-vs-weak-names</a></li><li><a href=\"https://www.igorinternational.com/process/name-evaluation-brand-evaluate-names.php\">https://www.igorinternational.com/process/name-evaluation-brand-evaluate-names.php</a></li></ul>\n<p>It also applied the radio test (heard once, spelled right?) and a cold read (what a stranger would think it is).</p>\n<h3>Not checked</h3>\n<p>Trademarks outside the US, and US trademarks for all but the 25 names searched. Facebook. Whatnot shop names (its terms of service are under review). Whether any real person reads a name the way the reviewer says — nobody outside this system has heard these names yet.</p>\n", "watchUntil": "2027-01-14"};

function computeOrder(k){
  const sec = document.getElementById("panel-" + k);
  const on = [...sec.querySelectorAll(".chip[aria-pressed='true']")].map(b => b.dataset.f);
  let rows = DATA.names.filter(x => x.p === k);
  if (on.includes("liked")) rows = rows.filter(isLiked);
  if (on.includes("keep")) rows = rows.filter(x => (x.r?.score ?? 0) >= 6);
  if (on.includes("all4")) rows = rows.filter(allFree);
  if (on.includes("rob")) rows = rows.filter(x => x.src === "rob");
  const liked = rows.filter(isLiked).sort(byScore);
  const pickable = x => !isLab(x) && !inUse(x) && !isLiked(x);
  let top = (DATA.top5[k] || []).map(n => rows.find(x => x.n === n.toLowerCase().replace(/\.com$/, ""))).filter(Boolean).filter(pickable);
  top = [...top, ...rows.filter(x => pickable(x) && !top.includes(x)).sort(byScore)].slice(0, 5);
  const used = new Set([...liked, ...top]);
  const groups = [];
  if (liked.length) groups.push(["Rob’s likes", liked, {}]);
  if (top.length) groups.push(["Top picks — highest scores", top, {top: true}]);
  for (const f of [...FAM.map(r => r[0]), "unsorted", "lab"]) {
    const g = rows.filter(x => !used.has(x) && famOf2(x) === f).sort((a, b) => (inUse(a) - inUse(b)) || byScore(a, b));
    if (g.length) groups.push([famLabel(f), g, {}]);
  }
  ORDER[k] = groups;
}

  try { MY_ID = user ? await user.id() : null; } catch (e) { MY_ID = null; }
  if (!MY_ID) {  // id() may be null for a viewer (org settings) — vote with a per-browser id instead
    try { MY_ID = localStorage.getItem("names-voter"); } catch (e) {}
    if (!MY_ID) { MY_ID = "anon-" + Math.random().toString(36).slice(2, 12); try { localStorage.setItem("names-voter", MY_ID); } catch (e) {} }
  }
  PROJECTS.forEach(P => {
    document.getElementById("askbtn-"+P.k).hidden = !SAMPLE;
    document.getElementById("qbtn-"+P.k).hidden = !DB;
    document.getElementById("talknote-"+P.k).textContent =
      SAMPLE || DB ? "Checks run from Rob’s machine (the page can’t reach the domain registry), so queued names show “waiting” until then."
                   : "Asking Claude and the check queue only work when this page is opened inside Claude.";
  });
  let canWrite = null;   // false = view-only (e.g. someone outside Rob's account on a shared link)
  try { canWrite = user && user.can ? await user.can("data.write") : null; } catch (e) { canWrite = null; }
  PROJECTS.forEach(P => { const v = document.getElementById("votebar-" + P.k); if (v) v.innerHTML = !DB
    ? "Voting isn’t available in this view — open this page inside Claude to vote."
    : canWrite === false
    ? "You can look through every name here, but this link is view-only — voting is for the page owner."
    : "<b>Tap 👍 Like</b> on names you want. Your likes collect in the bar at the bottom."; });
  if (DB && MY_ID && canWrite !== false) {
    CAN_LIKE = true;
    PROJECTS.forEach(P => { const m = document.getElementById("morelike-" + P.k); if (m) m.hidden = false; });
    DB.collection("likes").onSnapshot(s => {
      LIKES.mine = new Set(); LIKES.count = {};
      s.docs.forEach(d => { const v = d.data(); if (!v) return; const kk = `${v.project}:${v.name}`;
        LIKES.count[kk] = (LIKES.count[kk] || 0) + 1; if (v.by === MY_ID) LIKES.mine.add(kk); });
      if (!LIKES.seen) { LIKES.seen = true; PROJECTS.forEach(P => renderList(P.k, true)); updateTray(); }
      else refreshLikeButtons();
    }, () => { CAN_LIKE = false; });
    DB.collection("requests").onSnapshot(s => renderRequests(s.docs), () => {});
  }
  if (DB) DB.collection("queue").onSnapshot(s => renderQueue(s.docs), () => {
    PROJECTS.forEach(P => { document.getElementById("qbtn-"+P.k).hidden = true; });
  });
})();
</script>

</body></html>
