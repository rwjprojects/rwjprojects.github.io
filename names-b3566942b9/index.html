.lede{color:var(--muted);max-width:68ch;margin:0}

const META = {"ledeHtml": "Rob’s three lists and two rounds of new ideas, <b>524 names</b> in all, run through the .com registry and the four social sites on 16 Sep 2026. <b>35 of Rob’s 138</b> are still free as a .com. Everything already registered is removed; what is left is rated by a separate reviewer against published naming rules. The fourth tab is the same process run on Nate’s plant shop, as a test.", "methodHtml": "\n<h3>1 · Is the .com registered?</h3>\n<p>Every name was looked up in the .com registry itself (Verisign’s public lookup). “Not found” means nobody owns it.\nA second, separate check (public DNS) ran beside it; the two never disagreed. Each run first looked up\n<code>google.com</code> (must come back taken) and a random string (must come back free).</p>\n<h3>2 · Is it about to come free?</h3>\n<p>No registered name on any list is in the registry’s “redemption” or “pending delete” state, which is the only\nreliable sign a name is lapsing. The renew-soon names are listed under each tab as watch-only.</p>\n<h3>3 · What does it cost?</h3>\n<p>Every free name was priced at Porkbun, our registrar: every free name came back at the standard $11.08 a year, and none is priced as premium.</p>\n<h3>4 · Is the handle free?</h3>\n<ul>\n<li><b>TikTok</b>: the profile page carries its own “account not found” code (TikTok answers every address, so the page code is the signal).</li>\n<li><b>YouTube</b>: the @handle page exists or it doesn’t.</li>\n<li><b>X</b>: X’s own sign-up check, which also knows about suspended and reserved handles. X handles must be 5–15 letters, so longer names show “can’t use”.</li>\n<li><b>Instagram</b>: needs a real browser; each name’s page was opened and read.</li>\n</ul>\n<p>Every platform was tested first with an account that exists and one that doesn’t; all passed. The Instagram and X checks first ran in three batches side by side; X refused about a third of those lookups for going too fast, so they were re-run one at a time. Four X handles and two Instagram handles still got no clear answer — they show grey (“not checked”), never as free.</p>\n<h3>5 · Is the name already in use?</h3>\n<p>The final top five in each project (20 names) were searched for an existing business, product, app, channel or US trademark in the same field: about 75 web searches and 91 lookups on the USPTO’s own trademark search. Result: 14 clear, 5 caution, 1 collision (rcairboss — AirBoss RC is an established RC jet and radio retailer). Each top pick shows its own result. Earlier, the rater’s searches found Hangar 9 (Horizon Hobby’s RC brand — every “hangar” name echoes it), Tower Hobbies, Knife Edge Software (RealFlight), “buddy box” (a generic RC trainer product), HobbyKing’s Foam Fury planes and “prop nut” (an RC part). The other 210 free names had no collision search of their own.</p>\n<h3>6 · Is it a good name?</h3>\n<p>A separate reviewer rated every free name without being told who wrote which, told to assume they were\nmediocre and to justify any high score against these published rules:</p>\n<ul><li><a href=\"https://eatmywords.com/smile-scratch-test/\">https://eatmywords.com/smile-scratch-test/</a></li><li><a href=\"https://www.martyneumeier.com/strong-vs-weak-names\">https://www.martyneumeier.com/strong-vs-weak-names</a></li><li><a href=\"https://www.igorinternational.com/process/name-evaluation-brand-evaluate-names.php\">https://www.igorinternational.com/process/name-evaluation-brand-evaluate-names.php</a></li></ul>\n<p>It also applied the radio test (heard once, spelled right?) and a cold read (what a stranger would think it is).</p>\n<h3>Not checked</h3>\n<p>Trademarks outside the US, and US trademarks for all but the 20 top picks. Facebook. Palmstreet and Whatnot shop names for Nate. Whether any real person reads a name the way the rater says — nobody outside this system has heard these names yet. Nate has not been asked what he sells or what he likes, so his tab is a test run.</p>\n", "watchUntil": "2027-01-14"};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls = v => v === "free" ? "ok" : v === "taken" ? "bad" : "na";

function priceChip(x){
  if (x.premium === "yes") return `<span class="st bad">premium $${esc(x.price)}</span>`;
  if (x.price && /^\d/.test(x.price)) return `<span class="st ok">.com free · $${esc(x.price)}</span>`;
  return `<span class="st ok">.com free</span><span class="st na">price not checked</span>`;
}
function handleChips(x){
  return PL.map(([k,,label]) => {
    const v = x.h[k] || "not checked";
    const word = v === "free" ? "free" : v === "taken" ? "taken" : v.startsWith("too long") ? "too long" : v.startsWith("unusable") ? "can’t use" : "not checked";
    return `<span class="st ${cls(v)}" title="${esc(v)}">${label} ${word}</span>`;
  }).join("");
}
function dots(x){
  return `<div class="dots">` + PL.map(([k,l,label]) => {
    const v = x.h[k] || "not checked";
    return `<span class="dot ${cls(v)}" title="${label}: ${esc(v)}" aria-label="${label}: ${esc(v)}">${l}</span>`;
  }).join("") + `</div>`;
}
function pickCard(x, i){
  const r = x.r || {};
  const coll = x.coll ? `<p class="kv"><span>Same name in use?</span>${esc(x.coll)}</p>` : `<p class="kv"><span>Same name in use?</span>not searched</p>`;
  return `<article class="pick">
    <div class="row" style="justify-content:space-between"><span class="rank">#${i+1} · rater score <span class="score">${esc(r.score ?? "–")}</span>/10</span><span class="src ${x.src}">${x.src === "rob" ? "Rob’s list" : "new idea"}</span></div>
    <div class="dom">${esc(x.n)}<span class="tld">.com</span></div>
    <div class="row">${priceChip(x)}</div>
    <div class="row">${handleChips(x)}</div>
    <p class="kv"><span>Why</span>${esc(r.why)}</p>
    <p class="kv"><span>Cold read</span>${esc(r.cold_read)}</p>
    <p class="kv"><span>Radio test</span>${esc(r.radio)}</p>
    ${coll}
  </article>`;
}

    : `<span>Rob’s list <b>${robAll}</b> → free <b>${robFree}</b></span><span>new ideas <b>${newAll}</b> → free <b>${newFree}</b></span><span>free on all four socials <b>${mine.filter(allFree).length}</b> of ${mine.length}</span>`;
  const watch = tk.filter(x => x.expires && x.expires <= META.watchUntil).sort((a,b) => a.expires.localeCompare(b.expires));
  return `<section role="tabpanel" id="panel-${P.k}" data-k="${P.k}" hidden>

    <div class="live-only">

    <div class="talk" data-talk="${P.k}">
      <label for="ask-${P.k}" class="fine">A question, a name you like, or a direction to try — Claude answers here. Names it suggests are <b>not checked</b> until you send them to the check queue.</label>
      <textarea id="ask-${P.k}" placeholder="${P.k === "C" ? "e.g. something about crashes and saves that works on a t-shirt" : P.k === "B" ? "e.g. what about names about handing the club on to the next officer?" : P.k === "N" ? "e.g. he mostly sells hoyas — does that change anything?" : "e.g. why did lobeandbeyond score highest?"}"></textarea>
      <div class="row">
        <button class="btn" id="askbtn-${P.k}" data-act="ask" hidden>Ask Claude</button>
        <button class="btn ghost" id="stopbtn-${P.k}" data-act="stop" hidden>Stop</button>
        <button class="btn ghost" id="qbtn-${P.k}" data-act="queue-typed" hidden>Send typed names to the check queue</button>
      </div>
      <p class="reply" id="reply-${P.k}"></p>
      <ul class="sugg" id="sugg-${P.k}"></ul>
      <p class="fine" id="talknote-${P.k}">Loading… (the Ask and queue buttons appear when this page is opened inside Claude)</p>
    </div>
    <h2>Check queue <small>names waiting for the real check, then the blind rating</small></h2>
    <div class="tablebox queue"><table style="min-width:600px">
      <thead><tr><th>Name</th><th>Status</th><th>.com · socials</th><th>Score</th><th>Rater’s note</th></tr></thead>
      <tbody id="queue-${P.k}"><tr><td colspan="5" class="empty">Nothing waiting.</td></tr></tbody>
    </table></div>
    </div>
    <h2>Best of each kind <small>the top-scoring free name in each kind of name</small></h2>
    <div class="kinds">${FAM.map(([f, lab, hint]) => {
      const inF = mine.filter(x => famOf(x) === f);
      if (!inF.length) return `<div class="kind"><span class="lab">${esc(lab)}</span><span class="meta">none on this list yet — ${esc(hint)}</span></div>`;
      const best = [...inF].sort((a, b) => (b.r?.score ?? -1) - (a.r?.score ?? -1) || freeCount(b) - freeCount(a))[0];
      return `<div class="kind"><span class="lab">${esc(lab)} · ${inF.length}</span><span class="best">${esc(best.n)}<span style="color:var(--muted);font-weight:400">.com</span></span>
        <span class="meta">score ${esc(best.r?.score ?? "–")}/10 · ${esc(hint)}</span>${dots(best)}</div>`;
    }).join("")}</div>
    <h2>Every free name <small>${mine.length} names — .com unregistered, grouped by kind</small></h2>
    <p class="spread">${FAM.map(([f, lab]) => { const n = mine.filter(x => famOf(x) === f).length; return `<span>${esc(lab)} <b>${n}</b></span>`; }).join("")}${mine.some(x => famOf(x) === "unsorted") ? `<span>not yet sorted <b>${mine.filter(x => famOf(x) === "unsorted").length}</b></span>` : ""}</p>
    <div class="filters" role="group" aria-label="Filter">
      <button class="chip" id="f-keep-${P.k}" data-f="keep" aria-pressed="false">Rater would keep</button>
      <button class="chip" id="f-all-${P.k}" data-f="all4" aria-pressed="false">Free on all 4 socials</button>
      ${P.k === "N" ? "" : `<button class="chip" id="f-rob-${P.k}" data-f="rob" aria-pressed="false">Rob’s list only</button>`}
    </div>
    <div class="tablebox"><table>
      <thead><tr><th>Name</th><th>Score</th><th>Socials</th><th>Price</th><th>From</th><th>Rater’s note</th></tr></thead>
      <tbody class="names"></tbody>
    </table></div>
    <details><summary>Registered already — removed (${tk.length})</summary>
      <p class="note">These have an owner in the .com registry. ${tk.some(x => x.dropping) ? "The one marked <b>lapsing</b> is in the registry’s redemption period: its owner let it expire, and it may be auctioned or released — a backorder is the way to try for it." : "None is in the registry’s “redemption” or “pending delete” state, which is what a name about to come free shows."}</p>
      <ul class="namelist">${tk.map(x => `<li>${esc(x.n)}${x.src === "rob" ? " ·Rob" : ""}${x.dropping ? " <b>(lapsing)</b>" : ""}</li>`).join("")}</ul>
    </details>
    ${watch.length ? `<details><summary>Registered, renewal due within 120 days — watch only (${watch.length})</summary>
      <p class="note">An expiry date is not a drop. Most names renew automatically, and investor registrars (NameBright is one) never let them lapse. A name that does lapse usually goes to the registrar’s own auction before the public can buy it.</p>
      <ul class="namelist" style="columns:1">${watch.map(x => `<li>${esc(x.n)}.com — renews ${esc(x.expires)} · ${esc(x.registrar)}</li>`).join("")}</ul>
    </details>` : ""}
  </section>`;
}

function renderRows(k){
  const sec = document.getElementById("panel-"+k);
  const on = [...sec.querySelectorAll(".chip[aria-pressed='true']")].map(b => b.dataset.f);
  let rows = DATA.names.filter(x => x.p === k);
  if (on.includes("keep")) rows = rows.filter(x => x.r && x.r.verdict === "keep");
  if (on.includes("all4")) rows = rows.filter(allFree);
  if (on.includes("rob")) rows = rows.filter(x => x.src === "rob");
  rows.sort((a,b) => ((b.r?.score ?? -1) - (a.r?.score ?? -1)) || (freeCount(b) - freeCount(a)) || a.n.localeCompare(b.n));
  const order = [...FAM.map(r => r[0]), "unsorted"];
  const groups = order.map(f => [f, rows.filter(x => famOf(x) === f)]).filter(([, g]) => g.length);
  const rowHtml = x => `<tr>
    <td class="nm">${esc(x.n)}</td>
    <td class="num">${esc(x.r?.score ?? "–")}${x.r?.verdict === "drop" ? ' <span class="st na">drop</span>' : ""}</td>
    <td>${dots(x)}</td>
    <td class="num">${x.premium === "yes" ? `<span class="st bad">$${esc(x.price)}</span>` : x.price && /^\d/.test(x.price) ? "$"+esc(x.price) : "–"}</td>
    <td><span class="src ${x.src}">${x.src === "rob" ? "Rob" : "new"}</span></td>
    <td class="why">${esc(x.r?.why)}${x.lint && x.lint.length ? `<br><span class="st warn">${esc(x.lint.join("; "))}</span>` : ""}</td>
  </tr>`;
  sec.querySelector("tbody.names").innerHTML = groups.map(([f, g]) =>
    `<tr class="grp"><th colspan="6">${esc(famLabel(f))}<small>${g.length} name${g.length === 1 ? "" : "s"}</small></th></tr>` + g.map(rowHtml).join("")
  ).join("") || `<tr><td colspan="6" class="empty">No names match these filters.</td></tr>`;
}

function methodPanel(){
  return `<section role="tabpanel" id="panel-M" data-k="M" hidden><div class="prose">
    <h2 style="margin-top:0">How each name was checked</h2>
    ${META.methodHtml}
  </div></section>`;
}

const tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
const ALL = [...PROJECTS, {k:"M", tab:"How it was checked"}];
tabs.innerHTML = ALL.map(P => `<button role="tab" id="tab-${P.k}" aria-controls="panel-${P.k}" aria-selected="false">${esc(P.tab)}</button>`).join("");
panels.innerHTML = PROJECTS.map(panel).join("") + methodPanel();
PROJECTS.forEach(P => renderRows(P.k));
document.getElementById("lede").innerHTML = META.ledeHtml;

function show(k){
  ALL.forEach(P => {
    document.getElementById("tab-"+P.k).setAttribute("aria-selected", String(P.k === k));
    document.getElementById("panel-"+P.k).hidden = P.k !== k;
  });
  try { localStorage.setItem("names-tab", k); } catch (e) {}
}
tabs.addEventListener("click", e => { const b = e.target.closest("button[role=tab]"); if (b) show(b.id.slice(4)); });
panels.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
  renderRows(b.closest("section").dataset.k);
});
let start = "A";
try { const s = localStorage.getItem("names-tab"); if (s && ALL.some(P => P.k === s)) start = s; } catch (e) {}
show(start);

// ---------- talk it through + check queue (runtime capabilities; the page works without them) ----------
const talkState = {};           // per project: the conversation this view keeps
let DB = null, SAMPLE = null, USER = null, MY_ID = null;
const cleanName = s => String(s || "").toLowerCase().replace(/^https?:\/\//, "").replace(/\.com$/, "").replace(/[^a-z]/g, "");
const knownNames = k => {
  const free = DATA.names.filter(x => x.p === k).map(x => x.n);
  const gone = DATA.taken.filter(x => x.p === k).map(x => x.n);
  return {free, gone};
};
function instructions(P){
  const {free, gone} = knownNames(P.k);
  const top = (DATA.top5[P.k] || []).map(n => {
    const x = DATA.names.find(y => y.p === P.k && y.n === n);
    return x ? `${n} (blind score ${x.r?.score ?? "?"}/10: ${x.r?.why ?? ""})` : n;
  }).join("\n");
  return `You are a naming partner helping choose a brand name. Project: ${P.title}. Brief: ${P.brief}
Rules: a bare .com, letters only, 15 characters or fewer; the same word must work as a social handle. Constraints: ${P.avoid}
How names are judged here: Alexandra Watkins' SMILE (Suggestive, Meaningful, Imagery, Legs, Emotional) and SCRATCH (Spelling-challenged, Copycat, Restrictive, Annoying, Tame, Curse of knowledge, Hard to pronounce), plus a radio test (heard once, spelled right?) and a cold read (what a stranger thinks it is).
Current top picks from an independent blind rater:
${top}
Already registered by someone else — never suggest these: ${gone.join(", ")}
Already checked and free: ${free.join(", ")}
You cannot check availability. Never say a name is available or free unless it is in the "already checked and free" list; for anything new say it is not checked yet.
Answer the viewer plainly and briefly (under 120 words), disagreeing when they are wrong. When you suggest names, suggest at most 8 NEW ones not in either list.
Reply with ONLY a JSON object: {"reply": "your answer", "names": [{"name": "lowercaseletters", "why": "one line", "catch": "one honest line"}]} — "names" may be an empty array.`;
}
function setTalkBusy(k, busy){
  document.getElementById("askbtn-"+k).disabled = busy;
  document.getElementById("stopbtn-"+k).hidden = !busy;
}
async function ask(P){
  const box = document.getElementById("ask-"+P.k), out = document.getElementById("reply-"+P.k), ul = document.getElementById("sugg-"+P.k);
  const q = box.value.trim(); if (!q || !SAMPLE) return;
  const st = talkState[P.k] ||= {turns: [], ctl: null};
  st.turns.push({role: "user", content: q});
  st.turns = st.turns.slice(-8);
  if (st.turns[0].role !== "user") st.turns.shift();
  st.ctl = new AbortController();
  setTalkBusy(P.k, true); out.textContent = "Thinking…"; ul.innerHTML = "";
  try {
    const res = await SAMPLE.json([{role: "user", content: instructions(P)}, ...st.turns], {signal: st.ctl.signal, cache: false});
    const reply = String(res?.reply ?? "");
    out.textContent = reply || "(no answer text)";
    st.turns.push({role: "assistant", content: reply || "(no answer)"});
    const {free, gone} = knownNames(P.k);
    const names = Array.isArray(res?.names) ? res.names : [];
    ul.innerHTML = names.map(s => {
      const n = cleanName(s?.name);
      if (!n) return "";
      const state = gone.includes(n) ? '<span class="st bad">already registered</span>' : free.includes(n) ? '<span class="st ok">checked: .com free</span>' : '<span class="st na">not checked</span>';
      const btn = (gone.includes(n) || free.includes(n) || !DB) ? "" : `<button class="btn ghost" data-act="queue-one" data-name="${esc(n)}" data-why="${esc(s?.why)}">Check it</button>`;
      return `<li><span class="nm">${esc(n)}.com</span>${state}<span class="why">${esc(s?.why)}${s?.catch ? " · Catch: " + esc(s.catch) : ""}</span>${btn}</li>`;
    }).join("");
    box.value = "";
  } catch (e) {
    st.turns.pop();
    const copy = {cancelled: "", not_granted: "Claude isn’t allowed on this page for you — the Ask button is off.", sampling_disabled: "Claude isn’t available for this account.",
      rate_limited: "Too many questions at once — try again in a minute.", invalid_json: "The answer came back garbled — try asking again.", refused: "Claude wouldn’t answer that one — try rewording it."}[e?.code];
    out.textContent = (e?.text && e.code !== "refused") ? e.text : (copy ?? "Something went wrong reaching Claude — try again.");
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code)) {
      document.getElementById("askbtn-"+P.k).hidden = true;
    }
  } finally {
    setTalkBusy(P.k, false);
  }
}
async function queueNames(k, list, source){
  if (!DB) return 0;
  const {free, gone} = knownNames(k);
  let added = 0;
  for (const item of list) {
    const n = cleanName(item.name);
    if (n.length < 3 || n.length > 18 || free.includes(n) || gone.includes(n)) continue;
    const ref = DB.doc(`queue/${k}-${n}`);
    try {
      const snap = await ref.get();
      if (snap.exists) continue;
      await ref.set({project: k, name: n, status: "waiting", source, why: String(item.why || "").slice(0, 300),
                     addedBy: MY_ID || "", addedAt: new Date().toISOString()});
      added++;
    } catch (e) {
      document.getElementById("talknote-"+k).textContent = e?.code === "quota_exceeded" ? "The check queue is full." : "Couldn’t add to the check queue (you may have view-only access).";
      break;
    }
  }
  return added;
}
function renderQueue(docs){
  const byP = {A: [], B: [], C: [], N: []};
  docs.forEach(d => { const v = d.data(); if (v && byP[v.project]) byP[v.project].push(v); });
  for (const k of Object.keys(byP)) {
    const body = document.getElementById("queue-"+k); if (!body) continue;
    const rows = byP[k].sort((a, b) => String(b.addedAt).localeCompare(String(a.addedAt)));
    body.innerHTML = rows.length ? rows.map(v => {
      const checked = v.status === "checked";
      const com = !checked ? "" : v.com === "free" ? `<span class="st ok">.com free${v.price ? " · $" + esc(v.price) : ""}</span>` : `<span class="st bad">.com ${esc(v.com)}</span>`;
      const h = checked && v.handles ? dots({h: v.handles}) : "";
      return `<tr><td class="nm">${esc(v.name)}</td>
        <td>${checked ? '<span class="st ok">checked</span>' : '<span class="st warn">waiting</span>'}<br><span class="fine">${v.source === "claude" ? "Claude’s idea" : "typed in"}</span></td>
        <td>${com}${h}</td><td class="num">${checked && v.score != null ? esc(v.score) + "/10" : "–"}</td>
        <td class="why">${esc(checked ? (v.rater_why || v.note || "") : (v.why || ""))}</td></tr>`;
    }).join("") : `<tr><td colspan="5" class="empty">Nothing waiting.</td></tr>`;
  }
}
panels.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const k = b.closest("section").dataset.k, P = PROJECTS.find(p => p.k === k);
  if (b.dataset.act === "ask") ask(P);
  if (b.dataset.act === "stop") talkState[k]?.ctl?.abort();
  if (b.dataset.act === "queue-one") {
    b.disabled = true;
    const n = await queueNames(k, [{name: b.dataset.name, why: b.dataset.why}], "claude");
    b.textContent = n ? "Queued" : "Already queued";
  }
  if (b.dataset.act === "queue-typed") {
    const box = document.getElementById("ask-"+k);
    const list = box.value.split(/[\s,;]+/).map(s => ({name: s})).filter(x => cleanName(x.name));
    const n = await queueNames(k, list, "typed");
    document.getElementById("talknote-"+k).textContent = n ? `Added ${n} to the check queue. They’re checked from Rob’s machine, then this page updates.` : "Nothing new to add (names must be 3–18 letters and not already on this page).";
    if (n) box.value = "";
  }
});
if (!window.claude) document.querySelectorAll(".live-only").forEach(el => { el.hidden = true; });
if (window.claude) (async () => {
  const [sample, db, user] = await Promise.all([claude.use("sample"), claude.use("db"), claude.use("user")].map(p => p.catch(() => null)));
  SAMPLE = sample; DB = db; USER = user;
  try { MY_ID = user ? await user.id() : null; } catch (e) { MY_ID = null; }
  PROJECTS.forEach(P => {
    document.getElementById("askbtn-"+P.k).hidden = !SAMPLE;
    document.getElementById("qbtn-"+P.k).hidden = !DB;
    document.getElementById("talknote-"+P.k).textContent =
      SAMPLE || DB ? "Checks run from Rob’s machine (the page can’t reach the domain registry), so queued names show “waiting” until then."
                   : "Asking Claude and the check queue only work when this page is opened inside Claude.";
  });
  if (DB) DB.collection("queue").onSnapshot(s => renderQueue(s.docs), () => {
    PROJECTS.forEach(P => { document.getElementById("qbtn-"+P.k).hidden = true; });
  });
})();
</script>

</body></html>
